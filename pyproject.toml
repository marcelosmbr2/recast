[project]
name = "media-converter"
version = "0.1.0"
description = "Aplicação desktop de conversão de mídia com PySide6 (Qt Widgets)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
]

[project.gui-scripts]
media-converter = "media_converter.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
