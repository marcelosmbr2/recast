[project]
name = "recast"
version = "0.1.0"
description = "Recast: conversor de arquivos offline com PySide6 (Qt Widgets)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psutil>=7.2.2",
    "py7zr>=1.1.4",
    "pypandoc-binary>=1.17",
    "pypdfium2>=5.14.0",
    "PySide6-Essentials>=6.8",
]

[project.gui-scripts]
recast = "recast.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
